version: 2

project_name: adguard-exporter

before:
  hooks:
    - go mod tidy

builds:
  - id: universal
    main: main.go
    binary: adguard-exporter
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 6

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

dockers_v2:
  - id: adguard-exporter
    ids:
      - universal
    dockerfile: Dockerfile
    images:
      - ghcr.io/znandev/adguardexporter
    tags:
      - "{{ .Tag }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v6
